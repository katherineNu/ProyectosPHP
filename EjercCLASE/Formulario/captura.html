<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Jugador</title>
    <style>
        body { background-color: #9999aa; font-family: sans-serif; display: flex; justify-content: center; margin-top: 40px; }
        form { background: white; padding: 30px; border-radius: 8px; width: 450px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        h2 { text-align: center; margin-top: 0; }
        .campo { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; }
        input[type="text"], input[type="number"], input[type="file"] { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        fieldset { border: 1px solid #ddd; padding: 15px; margin-bottom: 20px; border-radius: 4px; }
        legend { font-weight: bold; }
        .botones { margin-top: 20px; display: flex; gap: 10px; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button[type="reset"] { background-color: #007bff; }
    </style>
    <script>
        function validarFormulario() {
            const archivoInput = document.getElementById('imagen');
            if (archivoInput.files.length > 0) {
                const archivo = archivoInput.files[0];
                if (archivo.type !== 'image/png') {
                    alert('Validación Cliente: Solo se permiten archivos en formato PNG.');
                    return false;
                }
                if (archivo.size > 10240) { // 10 KB = 10 * 1024 bytes
                    alert('Validación Cliente: El archivo de imagen no debe superar los 10 KB.');
                    return false;
                }
            }
            return true;
        }
    </script>
</head>
<body>
    <form action="index.php" method="POST" enctype="multipart/form-data" onsubmit="return validarFormulario()">
        <h2>Formulario de Jugador</h2>
        
        <div class="campo">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>
        </div>
        
        <div class="campo">
            <label for="alias">Alias:</label>
            <input type="text" id="alias" name="alias" required>
        </div>
        
        <div class="campo">
            <label for="edad">Edad:</label>
            <input type="number" id="edad" name="edad" required>
        </div>
        
        <fieldset>
            <legend>Armas a elegir (puedes elegir varias):</legend>
            <label><input type="checkbox" name="armas[]" value="Maza"> Maza</label><br>
            <label><input type="checkbox" name="armas[]" value="Antorcha"> Antorcha</label><br>
            <label><input type="checkbox" name="armas[]" value="Martillo"> Martillo</label><br>
            <label><input type="checkbox" name="armas[]" value="Látigo"> Látigo</label>
        </fieldset>
        
        <fieldset>
            <legend>¿Practica artes mágicas?</legend>
            <label><input type="radio" name="magia" value="Sí" required> Sí</label><br>
            <label><input type="radio" name="magia" value="No" required> No</label>
        </fieldset>
        
        <div class="campo">
            <label for="imagen">Subir imagen:</label>
            <input type="file" id="imagen" name="imagen" accept="image/png">
        </div>
        
        <div class="botones">
            <button type="submit" name="enviar">Enviar</button>
            <button type="reset">Borrar</button>
        </div>
    </form>
</body>
</html>
